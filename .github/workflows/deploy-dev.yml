name: ServiTech Deploy Dev

on:
  push:
    branches:
      - development

permissions:
  contents: read
  id-token: write

jobs:
  deploy-dev:
    name: Desplegar ServiTech en dev
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_WORKSPACE: default

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Construir paquetes Lambda
        shell: bash
        run: bash scripts/build_lambdas_ci.sh

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Autenticarse en AWS mediante OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verificar identidad AWS
        run: aws sts get-caller-identity

      - name: Inicializar Terraform
        working-directory: terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="region=$AWS_REGION"

      - name: Comprobar formato Terraform
        working-directory: terraform
        run: terraform fmt -check

      - name: Validar Terraform
        working-directory: terraform
        run: terraform validate

      - name: Planificar despliegue
        working-directory: terraform
        run: terraform plan -input=false -out=tfplan

      - name: Aplicar plan
        working-directory: terraform
        run: terraform apply -input=false -auto-approve tfplan
